name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all,dev]"
      - name: Unit tests
        run: python -m pytest gaia/tests/unit -q
      - name: Package smoke test
        run: |
          python -m pip install build
          python -m build
          python -c "from gaia.src.phase4 import embedded_openclaw_runtime as r; assert r._bundle_path().is_file()"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaia-battle-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gaia-battle-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
